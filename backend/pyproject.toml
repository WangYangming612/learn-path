[project]
name = "learnpath-backend"
version = "0.1.0"
description = "LearnPath - 个性化学习路径动态生成系统后端"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "apscheduler>=3.10",
    "bcrypt<4.1",
    "chromadb>=1.5.9",
    "email-validator>=2.3.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.3.0",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
