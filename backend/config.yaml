# 应用基本配置
# What: 应用元信息和运行模式
# Why: 集中管理可配置项，便于不同环境（开发/测试/生产）切换
app:
  name: "LearnPath"
  version: "0.1.0"
  debug: true

# 服务器配置
# What: 服务监听地址和端口
# Why: 控制 FastAPI/Uvicorn 的启动参数，0.0.0.0 允许局域网访问
server:
  host: "0.0.0.0"
  port: 8000

# 存储配置
# What: 数据库类型选择
# Why: 开发阶段使用 SQLite 降低运维成本，生产环境切换 PostgreSQL
storage:
  type: "sqlite"        # 开发阶段使用SQLite，生产切换PostgreSQL
